version: 2

project_name: peerbridge

before:
  hooks:
    - go mod tidy

builds:
  - id: peerbridge
    main: ./cmd/peerbridge
    binary: peerbridge
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      # Apple never shipped 32-bit targets Go supports; Windows on 32-bit ARM
      # is effectively gone. Keep windows/386 for old x86 machines.
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: peerbridge
    # arm needs the GOARM suffix (armv6 / armv7) or both builds would collide
    # on the same archive name. Matches scripts/lib.sh peerbridge_platform.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - examples/config.example.yaml
      - examples/claude_desktop_config.example.json
      - scripts/install.ps1
      - .claude-plugin/plugin.json
      - skills/**/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
