allowed_roots:
  - /Users/you/code
# Max wall-clock time for one review or one chat turn. Needs a unit
# (600s, 10m) — a bare number is rejected.
# NOTE: this file is read once at server startup; restart Claude Desktop /
# the Codex app after editing. The effective values are logged as
# "config loaded" (Claude: ~/Library/Logs/Claude/mcp-server-peerbridge.log).
timeout: 600s
max_output_bytes: 200000
# How long job_status waits for a job before answering "running". Longer =
# fewer polls = fewer permission prompts in the GUI. Must stay below the MCP
# client's per-call timeout: Codex tool_timeout_sec (120 when written by our
# installers, 60 by default), Claude Desktop ~180s. 100s is safe with both
# installers; the built-in default is 50s.
status_poll: 100s
stream_output: false   # tee peer CLI output to the server log

# Peer agents. Both are optional; defaults shown. macOS GUI apps do not
# inherit your shell PATH, so use absolute paths if a CLI is not found
# (e.g. the output of `which claude`).
# model / effort are defaults for calls that pass none (effort: low | medium
# | high | xhigh | max). Don't also set them in extra_args: a call that passes
# model/effort would then be rejected as conflicting.
agents:
  codex:
    command: codex
    extra_args: []              # e.g. ["--search"]
    # model: gpt-5.5
    # effort: medium
  claude:
    command: claude
    extra_args: []
    # model: opus
    # effort: high
# legacy, still honoured and appended to agents.codex.extra_args:
# codex_extra_args: ["-c", "model=o3"]
